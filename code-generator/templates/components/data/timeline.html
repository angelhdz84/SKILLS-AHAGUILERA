<div x-data="[ID]Timeline()" x-init="init()" class="space-y-4">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-semibold flex items-center gap-2">
      <i class="bi bi-clock-history"></i> Historial
    </h3>
    <div class="flex gap-2">
      <select x-model="filtro" @change="filtrar" class="select select-bordered select-sm">
        <option value="todos">Todos</option>
        <option value="hoy">Hoy</option>
        <option value="semana">Esta semana</option>
        <option value="mes">Este mes</option>
      </select>
    </div>
  </div>

  <template x-if="cargando">
    <div class="space-y-4">
      <template x-for="i in 3" :key="i">
        <div class="flex gap-4">
          <div class="skeleton h-10 w-10 rounded-full shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div class="skeleton h-4 w-48"></div>
            <div class="skeleton h-3 w-32"></div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="!cargando && items.length === 0">
    <div class="text-center py-12 text-base-content/40">
      <i class="bi bi-inbox text-5xl block mb-3"></i>
      <p class="text-sm">No hay actividad registrada</p>
    </div>
  </template>

  <template x-if="!cargando && items.length > 0">
    <ul class="timeline timeline-snap-icon max-md:timeline-compact timeline-vertical">
      <template x-for="(item, idx) in items" :key="item.id || idx">
        <li>
          <div class="timeline-middle">
            <i :class="iconoPorTipo(item.tipo)" class="text-lg"></i>
          </div>
          <div class="timeline-end mb-8" :class="idx % 2 === 0 ? 'md:text-end' : ''">
            <time class="timeline-start text-xs text-base-content/40" x-text="formatearFecha(item.fecha)"></time>
            <div class="timeline-box p-4 border border-base-300 rounded-lg shadow-sm bg-base-100"
                 @click="abrirDetalle(item)" :class="{ 'cursor-pointer hover:bg-base-200': item.link }">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <p class="font-medium text-sm" x-text="item.titulo"></p>
                  <p class="text-xs text-base-content/60 mt-1 line-clamp-2" x-show="item.descripcion" x-text="item.descripcion"></p>
                </div>
                <span class="badge badge-sm" :class="badgePorTipo(item.tipo)" x-text="item.tipo"></span>
              </div>
              <div class="flex flex-wrap gap-2 mt-2" x-show="item.metadata">
                <template x-for="(val, key) in item.metadata" :key="key">
                  <span class="text-[10px] bg-base-300 px-2 py-0.5 rounded">
                    <span class="font-medium" x-text="key + ':'"></span>
                    <span x-text="val"></span>
                  </span>
                </template>
              </div>
            </div>
          </div>
          <hr x-show="idx < items.length - 1" class="bg-base-300" />
        </li>
      </template>
    </ul>
  </template>
</div>

<script>
function [ID]Timeline() {
  return {
    items: [],
    filtro: 'todos',
    cargando: true,

    async init() {
      this.cargando = true;
      try {
        this.items = await this.cargarHistorial();
      } catch (err) {
        console.error('Timeline error:', err);
        this.items = [];
      } finally {
        this.cargando = false;
      }
    },

    iconoPorTipo(tipo) {
      const map = {
        creado: 'bi bi-plus-circle text-success',
        actualizado: 'bi bi-pencil-square text-info',
        eliminado: 'bi bi-trash text-error',
        exportado: 'bi bi-download text-primary',
        importado: 'bi bi-upload text-secondary',
        sync: 'bi bi-arrow-repeat text-warning',
        login: 'bi bi-box-arrow-in-right text-info',
        error: 'bi bi-exclamation-triangle text-error'
      };
      return map[tipo?.toLowerCase()] || 'bi bi-record-circle text-base-content/40';
    },

    badgePorTipo(tipo) {
      const map = {
        creado: 'badge-success',
        actualizado: 'badge-info',
        eliminado: 'badge-error',
        error: 'badge-error badge-outline'
      };
      return map[tipo?.toLowerCase()] || 'badge-ghost';
    },

    formatearFecha(fecha) {
      if (!fecha) return '';
      const d = new Date(fecha);
      return d.toLocaleDateString('es-MX', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    },

    async cargarHistorial() {
      // Subagent: implementar carga desde DB
      return [];
    },

    filtrar() {
      // Subagent: implementar filtro local
    },

    abrirDetalle(item) {
      if (item.link) window.appRouter?.navigate(item.link);
    }
  };
}
</script>
