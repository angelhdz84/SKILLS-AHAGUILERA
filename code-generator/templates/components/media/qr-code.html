<div x-data="[ID]_qr()" x-init="init()" class="space-y-4">
  <div class="flex items-center justify-between">
    <h3 class="font-semibold flex items-center gap-2"><i class="bi bi-qr-code"></i> [TITLE]</h3>
  </div>

  <div class="flex flex-col items-center gap-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-base-300" x-ref="qrContainer">
      <div x-ref="qrCode" class="w-48 h-48 flex items-center justify-center">
        <img :src="qrSrc" x-show="qrSrc" class="w-full h-full object-contain" alt="QR Code">
        <div x-show="!qrSrc" class="flex flex-col items-center text-base-content/20">
          <i class="bi bi-qr-code text-6xl"></i>
          <p class="text-xs mt-2">Ingresa texto para generar</p>
        </div>
      </div>
    </div>

    <div class="w-full max-w-sm space-y-2">
      <textarea x-model="text" @input="generateQR()" rows="2"
                class="textarea textarea-bordered w-full text-sm resize-none"
                placeholder="[PLACEHOLDER]"></textarea>
      <div class="flex items-center gap-2">
        <input type="range" x-model="size" @input="generateQR()" min="128" max="512" step="16" class="range range-sm flex-1">
        <span class="text-xs text-base-content/40 w-10 text-right" x-text="size + 'px'"></span>
      </div>
    </div>

    <div x-show="qrSrc" class="flex items-center gap-2">
      <a :href="qrSrc" download="qrcode.png" class="btn btn-primary btn-sm">
        <i class="bi bi-download"></i> Descargar
      </a>
      <button @click="copyQR()" class="btn btn-ghost btn-sm">
        <i class="bi" :class="copied ? 'bi-check-lg text-success' : 'bi-clipboard'"></i>
        <span x-text="copied ? 'Copiado' : 'Copiar'"></span>
      </button>
    </div>

    <p x-show="error" class="text-xs text-error flex items-center gap-1">
      <i class="bi bi-exclamation-triangle"></i> <span x-text="error"></span>
    </p>
  </div>
</div>

<script>
function [ID]_qr() {
  return {
    text: '[QR_CONTENT]',
    size: 256,
    qrSrc: '',
    copied: false,
    error: '',

    init() {
      if (typeof QRCode === 'undefined') {
        this.error = 'QRCode library not loaded. Include qrcode.min.js'
        return
      }
      this.generateQR()
    },

    generateQR() {
      this.error = ''
      if (!this.text.trim()) { this.qrSrc = ''; return }
      try {
        const qr = new QRCode({ content: this.text, width: this.size, height: this.size, color: '#000000', background: '#ffffff' })
        this.qrSrc = qr.toDataURL()
      } catch (e) {
        this.error = e.message || 'Error generando QR'
      }
    },

    async copyQR() {
      try {
        const resp = await fetch(this.qrSrc)
        const blob = await resp.blob()
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ])
        this.copied = true
        setTimeout(() => this.copied = false, 2000)
      } catch {
        const a = document.createElement('a')
        a.href = this.qrSrc
        a.download = 'qrcode.png'
        a.click()
      }
    }
  }
}
</script>
