<!-- modules/ia-jutia/module.html (Full) v0.3
     Subida documentos + Chat QA (BD + Docs) + Busqueda + Stats + Predicciones
     Depende de: module.js (Alpine data iaFullData)
-->
<style>
  .ia-source-bd { border-left: 3px solid hsl(var(--p) / 0.5); }
  .ia-source-doc { border-left: 3px solid hsl(var(--a) / 0.5); }
</style>
<div x-data="iaFullData()" x-init="init('')" class="animate__animated animate__fadeIn">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold flex items-center gap-2">
      <i class="bi bi-robot text-primary"></i> IA / Busqueda Inteligente
    </h2>
    <span class="badge badge-accent badge-sm">
      <i class="bi bi-stars me-1"></i>Full
    </span>
  </div>

  <!-- Buscador global -->
  <div class="card bg-base-100 shadow-xl p-4 mb-6">
    <label class="input input-bordered flex items-center gap-2">
      <i class="bi bi-search text-base-content/40"></i>
      <input type="text" x-model="query" @input.debounce="buscar()"
             placeholder="Buscar en datos y documentos..."
             class="grow bg-transparent border-0 outline-none" />
      <kbd class="kbd kbd-sm hidden sm:inline">Ctrl+K</kbd>
    </label>
  </div>

  <!-- Resultados busqueda -->
  <template x-if="query.length > 0">
    <div class="mb-6">
      <span class="text-sm text-base-content/60 mb-2 block">
        <template x-if="searching">Buscando...</template>
        <template x-if="!searching"><span x-text="resultados.length + ' resultados'"></span></template>
      </span>
      <template x-if="!searching && resultados.length === 0">
        <div class="text-center py-8 text-base-content/40">
          <i class="bi bi-inbox text-4xl"></i>
          <p class="mt-2">Sin resultados para "<span x-text="query"></span>"</p>
        </div>
      </template>
      <div class="space-y-2">
        <template x-for="r in resultados" :key="r.id">
          <div class="card bg-base-200 p-3 cursor-pointer hover:bg-base-300 transition-colors">
            <div class="flex items-start gap-3">
              <i class="bi" :class="r.tabla === '_ia_docs' ? 'bi-file-earmark-text' : 'bi-table'"></i>
              <div class="flex-1 min-w-0">
                <p class="font-medium truncate" x-text="r.nombre || r.tabla"></p>
                <p class="text-sm text-base-content/60 truncate" x-text="r.texto?.slice(0, 120)"></p>
                <span class="badge badge-ghost badge-xs mt-1" x-text="r.tabla"></span>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- Panel principal (sin busqueda) -->
  <template x-if="!query">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Columna izquierda: Documentos -->
      <div class="space-y-4">
        <div class="card bg-base-100 shadow-xl p-4">
          <h3 class="font-semibold flex items-center gap-2 mb-3">
            <i class="bi bi-cloud-upload text-primary"></i> Subir documento
          </h3>
          <div @drop.prevent="subirArchivo($event)"
               @dragover.prevent="dragOver = true" @dragleave="dragOver = false"
               class="border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition-colors"
               :class="dragOver ? 'border-primary bg-primary/5' : 'border-base-300 hover:border-primary/50'"
               @click="$refs.fileInput.click()">
            <i class="bi bi-file-earmark-plus text-3xl text-base-content/30"></i>
            <p class="text-sm text-base-content/60 mt-2">Arrastra archivos o haz clic</p>
            <p class="text-xs text-base-content/40 mt-1">PDF, DOCX, XLSX, CSV, MD, TXT, JSON</p>
            <input type="file" x-ref="fileInput" @change="subirArchivo($event)"
                   accept=".pdf,.docx,.xlsx,.csv,.md,.txt,.json" class="hidden" multiple />
          </div>
          <template x-if="uploading">
            <div class="mt-3">
              <progress class="progress progress-primary w-full" :value="uploadProgress" max="100"></progress>
              <span class="text-xs text-base-content/60">Procesando documento...</span>
            </div>
          </template>
          <div x-show="$store.ia?.ocrStatus"
               x-cloak
               class="mt-2 flex items-center gap-2 text-sm"
               :class="$store.ia?.ocrStatus?.type === 'progress' ? 'text-info' : $store.ia?.ocrStatus?.type === 'done' ? 'text-success' : 'text-error'">
            <i class="bi" :class="$store.ia?.ocrStatus?.type === 'progress' ? 'bi-arrow-repeat animate-spin' : $store.ia?.ocrStatus?.type === 'done' ? 'bi-check-circle' : 'bi-exclamation-circle'"></i>
            <span x-text="$store.ia?.ocrStatus?.message"></span>
          </div>
        </div>

        <div class="card bg-base-100 shadow-xl p-4">
          <h3 class="font-semibold flex items-center gap-2 mb-3">
            <i class="bi bi-files text-secondary"></i> Documentos indexados
            <span class="badge badge-sm" x-text="documentos.length"></span>
          </h3>
          <template x-if="documentos.length === 0">
            <p class="text-sm text-base-content/40 text-center py-4">Aun no hay documentos</p>
          </template>
          <div class="space-y-2 max-h-60 overflow-y-auto">
            <template x-for="doc in documentos" :key="doc.id">
              <div class="flex items-center justify-between p-2 bg-base-200 rounded-lg">
                <div class="flex items-center gap-2 min-w-0">
                  <i class="bi" :class="iconoDoc(doc.tipo)"></i>
                  <div class="min-w-0">
                    <p class="text-sm truncate" x-text="doc.nombre"></p>
                    <p class="text-xs text-base-content/40">
                      <span x-text="doc.tipo?.toUpperCase()"></span>
                      <template x-if="doc.paginas"> · <span x-text="doc.paginas + ' pags'"></span></template>
                      · <span x-text="tamanoLegible(doc.tamano)"></span>
                    </p>
                  </div>
                </div>
                <button class="btn btn-ghost btn-xs btn-square text-error" @click="eliminarDoc(doc.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </template>
          </div>
        </div>

        <div class="card bg-base-100 shadow-xl p-4">
          <h3 class="font-semibold flex items-center gap-2 mb-3">
            <i class="bi bi-bar-chart text-accent"></i> Vista general
          </h3>
          <div class="grid grid-cols-2 gap-2">
            <template x-for="s in statsOverview" :key="s.tabla">
              <div class="stat bg-base-200 rounded-lg p-2">
                <div class="stat-title text-xs truncate" x-text="s.tabla"></div>
                <div class="stat-value text-lg" x-text="s.registros"></div>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Columna derecha: Chat con historial (v0.3) + fuentes separadas -->
      <div class="space-y-4">
        <!-- Chat drawer con threads -->
        <div class="card bg-base-100 shadow-xl p-4 flex flex-col" style="min-height: 400px;">
          <div class="drawer lg:drawer-open flex-1 min-h-0">
            <input id="chat-drawer" type="checkbox" class="drawer-toggle" x-model="chatSidebarOpen" />

            <div class="drawer-content flex flex-col min-h-0">
              <!-- Chat header -->
              <div class="flex items-center gap-2 pb-3 border-b border-base-300 mb-3">
                <label for="chat-drawer" class="btn btn-ghost btn-sm btn-square lg:hidden">
                  <i class="bi bi-list"></i>
                </label>
                <template x-if="currentChat">
                  <div class="flex-1 min-w-0">
                    <div class="font-semibold text-sm truncate" x-text="currentChat.titulo"></div>
                    <div class="text-xs text-base-content/50" x-text="currentChat.messageCount + ' mensajes'"></div>
                  </div>
                </template>
                <template x-if="!currentChat">
                  <div class="flex-1 font-semibold text-sm">Chat IA (BD + Documentos)</div>
                </template>
                <button class="btn btn-ghost btn-sm btn-square" @click="showNewChatModal = true" title="Nueva conversacion">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>

              <!-- Messages area con fuentes separadas -->
              <div class="flex-1 overflow-y-auto mb-3 space-y-3 min-h-[200px]" x-ref="chatBox">
                <template x-if="messages.length === 0">
                  <div class="text-center py-12 text-base-content/30">
                    <i class="bi bi-chat-dots text-4xl"></i>
                    <p class="text-sm mt-2">Inicia una conversacion</p>
                    <p class="text-xs">Pregunta sobre datos o documentos</p>
                  </div>
                </template>
                <template x-for="msg in messages" :key="msg.id">
                  <div>
                    <div class="chat chat-end" x-show="msg.rol === 'user'">
                      <div class="chat-bubble chat-bubble-primary text-sm" x-text="msg.contenido"></div>
                    </div>
                    <div class="chat chat-start" x-show="msg.rol === 'ia'">
                      <div class="chat-bubble chat-bubble-info text-sm whitespace-pre-wrap" x-text="msg.contenido"></div>
                      <!-- Fuentes como badges separados -->
                      <template x-if="msg.fuente">
                        <div class="mt-1 space-y-1">
                          <template x-for="(f, fi) in (typeof msg.fuente === 'string' ? JSON.parse(msg.fuente) : msg.fuente)" :key="fi">
                            <div class="flex items-center gap-1 text-xs px-2 py-1 rounded"
                                 :class="f.tipo === 'bd' ? 'bg-primary/10 ia-source-bd' : 'bg-accent/10 ia-source-doc'">
                              <i class="bi" :class="f.tipo === 'bd' ? 'bi-database' : 'bi-file-earmark-text'"></i>
                              <span :class="f.tipo === 'bd' ? 'text-primary' : 'text-accent'">
                                <span x-text="f.tipo === 'bd' ? 'BD: ' : 'Doc: '"></span>
                              </span>
                              <span class="text-base-content/60 truncate" x-text="f.texto"></span>
                            </div>
                          </template>
                        </div>
                      </template>
                      <template x-if="msg.score">
                        <p class="text-xs text-base-content/40 mt-1">Confianza: <span x-text="Math.round(msg.score * 100) + '%'"></span></p>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="chatting">
                  <div class="chat chat-start">
                    <div class="chat-bubble chat-bubble-ghost">
                      <span class="loading loading-dots loading-sm"></span>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Input area -->
              <div class="border-t border-base-300 pt-3">
                <form @submit.prevent="preguntar()" class="flex gap-2">
                  <input type="text" x-model="pregunta" placeholder="Pregunta sobre datos o documentos..."
                         class="input input-bordered flex-1 input-sm" :disabled="chatting" />
                  <button type="submit" class="btn btn-primary btn-sm" :disabled="!pregunta || chatting">
                    <i class="bi bi-send"></i>
                  </button>
                </form>
              </div>
            </div>

            <!-- Sidebar: conversation list -->
            <div class="drawer-side z-30">
              <label for="chat-drawer" class="drawer-overlay"></label>
              <div class="bg-base-200 min-h-full w-72 p-3 flex flex-col">
                <!-- Search in history (Nivel 2) -->
                <div class="mb-3">
                  <div class="relative">
                    <input type="text" x-model="historyQuery" @input.debounce.300ms="searchHistory()"
                           placeholder="Buscar en historial..."
                           class="input input-bordered input-xs w-full pl-7" />
                    <i class="bi bi-search absolute left-2 top-1/2 -translate-y-1/2 text-xs text-base-content/40"></i>
                  </div>
                  <template x-if="historyResults.length > 0">
                    <div class="mt-1 space-y-1 max-h-32 overflow-y-auto">
                      <template x-for="r in historyResults" :key="r.id">
                        <div class="px-2 py-1 rounded cursor-pointer text-xs hover:bg-base-300 transition-colors truncate"
                             @click="selectHistoryResult(r)">
                          <span class="text-base-content/60" x-text="r.contenido.slice(0, 60)"></span>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="flex items-center justify-between mb-3">
                  <h3 class="font-semibold text-sm">Conversaciones</h3>
                  <button class="btn btn-ghost btn-xs" @click="showNewChatModal = true">
                    <i class="bi bi-plus-lg"></i> Nueva
                  </button>
                </div>

                <div class="space-y-1 flex-1 overflow-y-auto">
                  <template x-for="chat in chats" :key="chat.id">
                    <div class="flex items-center gap-2 p-2 rounded-lg cursor-pointer transition-colors text-sm group"
                         :class="currentChat?.id === chat.id ? 'bg-primary/10 text-primary' : 'hover:bg-base-300'"
                         @click="selectChat(chat.id)">
                      <i class="bi bi-chat-text text-base-content/40"></i>
                      <div class="flex-1 truncate" x-text="chat.titulo"></div>
                      <span class="text-xs text-base-content/30" x-text="chat.messageCount"></span>
                      <button class="btn btn-ghost btn-xs btn-square opacity-0 group-hover:opacity-100 transition-opacity"
                              @click.stop="deleteChat(chat.id)"
                              title="Eliminar conversacion">
                        <i class="bi bi-trash3"></i>
                      </button>
                    </div>
                  </template>
                  <template x-if="chats.length === 0">
                    <p class="text-xs text-base-content/40 text-center py-6">No hay conversaciones</p>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- New chat modal -->
        <dialog class="modal" :class="{ 'modal-open': showNewChatModal }">
          <div class="modal-box">
            <h3 class="font-semibold mb-4">Nueva conversacion</h3>
            <input type="text" class="input input-bordered w-full"
                   placeholder="Titulo de la conversacion..."
                   x-model="newChatTitle"
                   @keydown.enter.prevent="createChat()">
            <div class="modal-action">
              <button class="btn btn-ghost btn-sm" @click="showNewChatModal = false">Cancelar</button>
              <button class="btn btn-primary btn-sm" @click="createChat()">Crear</button>
            </div>
          </div>
          <div class="modal-backdrop" @click="showNewChatModal = false"></div>
        </dialog>

        <div class="card bg-base-100 shadow-xl p-4">
          <h3 class="font-semibold flex items-center gap-2 mb-3">
            <i class="bi bi-graph-up-arrow text-accent"></i> Predicciones
          </h3>
          <div class="flex flex-wrap gap-2 mb-3">
            <select x-model="predTabla" class="select select-bordered select-xs flex-1">
              <option value="">Tabla...</option>
              <template x-for="t in tablasDisponibles" :key="t">
                <option :value="t" x-text="t"></option>
              </template>
            </select>
            <select x-model="predCampo" class="select select-bordered select-xs flex-1">
              <option value="">Campo...</option>
            </select>
            <button class="btn btn-accent btn-xs" @click="predecir()" :disabled="!predTabla || !predCampo">
              <i class="bi bi-lightning-charge"></i> Predecir
            </button>
          </div>
          <template x-if="prediccion">
            <div class="bg-base-200 rounded-lg p-2">
              <div class="flex items-center gap-2 mb-1">
                <span class="badge badge-xs" :class="prediccion.tendencia === 'creciente' ? 'badge-success' : 'badge-error'">
                  <i :class="prediccion.tendencia === 'creciente' ? 'bi-arrow-up' : 'bi-arrow-down'"></i>
                  <span x-text="prediccion.tendencia"></span>
                </span>
                <span class="text-xs text-base-content/60">R<sup>2</sup> = <span x-text="prediccion.r2"></span></span>
              </div>
              <div class="grid grid-cols-3 gap-1">
                <template x-for="p in prediccion.proyectados" :key="p.periodo">
                  <div class="text-center p-1 bg-base-100 rounded text-xs">
                    P<span x-text="p.periodo"></span>: <span class="font-bold" x-text="formatoMoneda(p.valor)"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>
</div>
